services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud9-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloud9-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud9-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: ${LOG_FORMAT:-text}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: "24"
      REFRESH_TOKEN_EXPIRATION_DAYS: "30"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://erp.thecloud9corp.com}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-erp.thecloud9corp.com,localhost,127.0.0.1}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@cloud9.local}
      # No default — startup fails if INITIAL_ADMIN_PASSWORD is unset
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set}
    # Backend listens on all interfaces within docker network
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/static/uploads
      - backend_backups:/app/backups
      - backend_logs:/app/logs
    restart: unless-stopped
    networks:
      - cloud9-network
    # Phase 5.4 — liveness vs readiness probes.
    healthcheck:
      # Liveness: process is up. Used by Docker restart policy.
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative path: requests go to the same origin as the site itself and
        # caddy reverse-proxies /api/* to backend. No mixed content, no CORS.
        VITE_API_URL: /api
    container_name: cloud9-frontend
    # Exposed on host so the server's main Caddy can reverse-proxy it.
    # (The repo no longer bundles its own Caddy - the site is served by
    #  the host's main Caddy, see ~/apps/caddy/Caddyfile.)
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloud9-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  backend_backups:
    driver: local
  backend_logs:
    driver: local

networks:
  cloud9-network:
    driver: bridge
